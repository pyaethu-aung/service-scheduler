version: "2"

run:
  # Lint integration tests too; without the tag they are invisible to every linter.
  build-tags:
    - integration

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    depguard:
      # The layer rules from CLAUDE.md, enforced.
      rules:
        slots-no-io:
          files:
            - "**/internal/slots/**"
          deny:
            - pkg: net
              desc: the slot engine is pure functions with no I/O
            - pkg: os
              desc: the slot engine is pure functions with no I/O
            - pkg: database/sql
              desc: the slot engine is pure functions with no I/O
            - pkg: github.com/jackc/pgx/v5
              desc: the slot engine is pure functions with no I/O
            - pkg: github.com/pyaethu-aung/service-scheduler/internal/db
              desc: the slot engine is pure functions with no I/O
        api-no-store:
          files:
            - "**/internal/api/**"
            - "!$test"
          deny:
            - pkg: github.com/pyaethu-aung/service-scheduler/internal/db
              desc: the HTTP layer calls the booking and availability services, never the store
            - pkg: github.com/jackc/pgx/v5
              desc: the HTTP layer calls the booking and availability services, never the store
    sloglint:
      kv-only: true
      context: scope
      key-naming-case: snake
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pyaethu-aung/service-scheduler
