# Default services: api + postgres (make up).
# The observability profile adds the OTel Collector, Jaeger and Prometheus:
#   COMPOSE_PROFILES=observability make up

name: service-scheduler

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      # Override in .env when 5432 is taken by another local database.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      API_KEY: ${API_KEY:-dev-api-key}
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      SLOT_GRANULARITY: ${SLOT_GRANULARITY:-15m}
      # Set by make up only when the observability profile is active, so a
      # plain stack does not log failed exports to a collector that is not
      # running.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${API_OTLP_ENDPOINT:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0-386
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - "16686:16686" # UI

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  pgdata:
