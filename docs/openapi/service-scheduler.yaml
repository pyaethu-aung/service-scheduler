openapi: 3.0.3
info:
  title: Service Scheduler API
  version: 0.1.0
  description: |
    Books service appointments for car dealerships, assigning a free service
    bay and a qualified technician for the whole service duration. Design:
    docs/system-design.md. This document is the contract; server interfaces
    are generated from it with oapi-codegen.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development (make run or make up)
security:
  - ApiKeyAuth: []
paths:
  /v1/appointments:
    post:
      operationId: bookAppointment
      summary: Book an appointment
      description: |
        Books a service appointment (FR1 to FR3). The system assigns a free
        service bay and the least-loaded qualified technician for the whole
        service duration; the caller chooses only the start time.

        The start must be in the future, on the slot grid, and the whole
        service must fit inside the dealership's opening hours on one local
        day. Two exclusion constraints in the database make double booking
        impossible; a request that loses a race is retried up to three times
        and then answered 409 with nearby free start times.

        Requests are idempotent by `Idempotency-Key`: repeating a key with
        the same body within 24 hours returns the original appointment in its
        current state (200) without booking again; repeating it with a
        different body is 422. Malformed requests are 422 as well.
      tags: [appointments]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-chosen key, unique per intended booking, kept for 24 hours.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: 6f1c9a52-0b7e-4c1f-9a0e-2d8f1b7c3e44
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
      responses:
        "201":
          description: Booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "200":
          description: Replay of an earlier request with the same Idempotency-Key and body; the appointment as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No bay or no qualified technician is free for the requested time.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SlotUnavailableProblem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/appointments/{appointmentId}:
    get:
      operationId: getAppointment
      summary: Fetch an appointment
      description: Returns the appointment in its current state, confirmed or cancelled.
      tags: [appointments]
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: The appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/appointments/{appointmentId}/cancel:
    post:
      operationId: cancelAppointment
      summary: Cancel an appointment
      description: |
        Cancels the appointment and releases its bay and technician at once
        (FR5, Section 5.4); the row is kept for history. Cancelling an
        already-cancelled appointment changes nothing and returns 200 with
        the same state, so the call is idempotent.
      tags: [appointments]
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: The cancelled appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/dealerships/{dealershipId}/availability:
    get:
      operationId: getAvailability
      summary: Free start times for a service type on a date
      description: |
        Lists the start times on one local date at which a bay and a technician
        qualified for the service type are both free for the whole service
        duration (FR4). Start times are on the slot grid, inside the
        dealership's opening hours, in the future, and returned in UTC.

        The list is advisory: a start shown as free can be taken before the
        client books, and the booking endpoint re-checks. A closed day, a past
        date, or a service type no technician here is qualified for returns an
        empty list.
      tags: [availability]
      parameters:
        - name: dealershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serviceTypeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          description: Local calendar date at the dealership (YYYY-MM-DD).
          schema:
            type: string
            format: date
            example: "2026-10-20"
      responses:
        "200":
          description: Free start times, possibly none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: |
        200 when the database answers and every migration this build ships
        has been applied; 503 otherwise, so a load balancer stops sending
        traffic. Does not require an API key.
      tags: [health]
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready; the failing checks say why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: Prometheus text exposition of the Section 9 metrics. Does not require an API key.
      tags: [health]
      security: []
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 while the process is serving HTTP. Does not touch the database.
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      description: An identifier that is not a UUID cannot exist, so it is a 404.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is malformed (an invalid UUID or date, or a missing parameter).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: A referenced resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: |
        The request is malformed or breaks a booking rule, or the
        Idempotency-Key was already used with a different body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    Forbidden:
      description: The X-API-Key header is missing or wrong.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          $ref: "#/components/schemas/ReadinessChecks"
    ReadinessChecks:
      type: object
      required: [database, migrations]
      properties:
        database:
          type: string
          description: '"ok", or why the database is unreachable.'
        migrations:
          type: string
          description: '"ok", or which version is applied versus expected.'
    Availability:
      type: object
      required: [dealershipId, serviceTypeId, date, timezone, durationMinutes, availableStarts]
      properties:
        dealershipId:
          type: string
          format: uuid
        serviceTypeId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          description: The requested local date.
        timezone:
          type: string
          description: The dealership's IANA timezone, which the date is local to.
          example: Europe/London
        durationMinutes:
          type: integer
          minimum: 1
          description: Service duration; each start reserves [start, start + duration).
        availableStarts:
          type: array
          description: Free start times in UTC, ascending.
          items:
            type: string
            format: date-time
          example: ["2026-10-20T07:00:00Z", "2026-10-20T07:15:00Z"]
    BookingRequest:
      type: object
      required: [dealershipId, customerId, vehicleId, serviceTypeId, startsAt]
      properties:
        dealershipId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
          description: Must belong to the customer.
        serviceTypeId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          description: Requested start, any offset; stored and returned in UTC.
          example: "2026-10-20T09:00:00+07:00"
    Appointment:
      type: object
      required: [id, status, startsAt, endsAt, dealership, serviceType, bay, technician, customerId, vehicleId]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [confirmed, cancelled]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Exclusive end; the appointment holds [startsAt, endsAt).
        dealership:
          $ref: "#/components/schemas/DealershipRef"
        serviceType:
          $ref: "#/components/schemas/ServiceTypeRef"
        bay:
          $ref: "#/components/schemas/ResourceRef"
        technician:
          $ref: "#/components/schemas/ResourceRef"
        customerId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
    DealershipRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ServiceTypeRef:
      type: object
      required: [id, code, durationMinutes]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: OIL_CHANGE
        durationMinutes:
          type: integer
          minimum: 1
    ResourceRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SlotUnavailableProblem:
      type: object
      description: RFC 9457 problem for a 409, with the reason and nearby free starts.
      required: [type, title, status, reason, suggestedStarts]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://service-scheduler.example/problems/slot-unavailable
        title:
          type: string
        status:
          type: integer
          enum: [409]
        detail:
          type: string
        reason:
          type: string
          enum: [no_bay_available, no_technician_available]
        suggestedStarts:
          type: array
          description: Up to three free starts on the same local day nearest the requested one, ascending, in UTC.
          maxItems: 3
          items:
            type: string
            format: date-time
    ValidationProblem:
      type: object
      description: RFC 9457 problem for a 422, listing every invalid parameter.
      required: [type, title, status, invalidParams]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://service-scheduler.example/problems/validation-failed
        title:
          type: string
        status:
          type: integer
          enum: [422]
        detail:
          type: string
        invalidParams:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvalidParam"
    InvalidParam:
      type: object
      required: [name, reason]
      properties:
        name:
          type: string
          description: Body field, header or parameter name.
          example: startsAt
        reason:
          type: string
          example: not on the 15-minute grid
    Problem:
      type: object
      description: RFC 9457 problem details. Extension members may be added per problem type.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type.
          example: https://service-scheduler.example/problems/slot-unavailable
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code for this occurrence.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence.
      additionalProperties: true
